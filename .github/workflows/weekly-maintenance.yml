name: Weekly maintenance check

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vulnerabilities: ${{ steps.audit.outputs.vulnerabilities }}
      live_probe: ${{ steps.live.outputs.state }}
      build_probe: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          touch node_modules/.install-stamp
      - name: Run repository checks and static build
        id: build
        run: make check && npm run build
      - name: Probe production HTTPS and recognizable content
        id: live
        if: always()
        # The site sits behind Cloudflare, which challenges non-browser clients from
        # datacenter ranges. A challenge means the edge is up but this probe cannot
        # read the origin: report that as "blocked" (the receipt records it) instead
        # of failing the ledger, while any other status still fails the run. A
        # persistent "blocked" means CI never verified production — add a WAF rule
        # exempting this probe, or check the site by hand each week.
        run: |
          headers="$RUNNER_TEMP/homepage.headers"
          body="$RUNNER_TEMP/homepage.html"
          status=$(curl --silent --show-error --location --retry 2 --max-time 30 \
            --dump-header "$headers" --output "$body" --write-out "%{http_code}" \
            "https://ericjanusson.ca/") || true
          status="${status:-000}"
          echo "Production probe: HTTP $status"
          if [ "$status" = "200" ] && grep --ignore-case --quiet --fixed-strings "Eric" "$body"; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if { [ "$status" = "403" ] || [ "$status" = "429" ]; } \
            && grep --ignore-case --quiet --extended-regexp '^(server: *cloudflare|cf-ray:|cf-mitigated:)' "$headers"; then
            echo "::warning::The Cloudflare edge answered HTTP $status to this automated client; production reachability is unverified and needs a manual check."
            echo "state=blocked ($status)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Production probe failed: HTTP $status without the expected content."
          echo "state=failed ($status)" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Capture dependency audit (report only; do not hide advisories)
        id: audit
        if: always()
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          if jq -e '.metadata.vulnerabilities' "$RUNNER_TEMP/npm-audit.json" >/dev/null 2>&1; then
            echo "vulnerabilities=$(jq -r '.metadata.vulnerabilities | "critical=\(.critical // 0), high=\(.high // 0), moderate=\(.moderate // 0), low=\(.low // 0)"' "$RUNNER_TEMP/npm-audit.json")" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerabilities=unavailable (investigate npm audit)" >> "$GITHUB_OUTPUT"
          fi
          echo "Security findings require review; no automatic dependency changes."

  receipt:
    needs: checks
    # Only main runs write to the durable ledger in issue 14; a branch run must not
    # record a receipt that claims to describe production.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post dated maintenance receipt
        uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          BUILD_PROBE: ${{ needs.checks.outputs.build_probe }}
          LIVE_PROBE: ${{ needs.checks.outputs.live_probe }}
          VULNERABILITIES: ${{ needs.checks.outputs.vulnerabilities }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              `### Automated weekly maintenance — ${date}`,
              `- Site: https://ericjanusson.ca/`,
              `- Checks job: ${process.env.CHECK_RESULT || 'unavailable'}`,
              `- Build/tests: ${process.env.BUILD_PROBE || 'not run'}`,
              `- Live HTTPS/content probe: ${process.env.LIVE_PROBE || 'not run'}`,
              `- npm audit: ${process.env.VULNERABILITIES || 'not available'} (findings need human triage)`,
              `- Main commit checked: \`${process.env.COMMIT_SHA}\``,
              `- [Workflow evidence](${process.env.RUN_URL})`,
              '',
              'Scope: automated build, npm audit, and HTTPS/content probe only. This does not independently verify TLS-chain details, every link, Dependabot PR compatibility, or production deployment SHA. No dependency changes or merges were performed.'
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 14,
              body,
            });
            if (process.env.CHECK_RESULT !== 'success') {
              core.setFailed('Weekly maintenance failed; inspect linked workflow and remediate.');
            }
